# Regenerate: dart run ffigen --config ffigen.yaml
name: ZeroTierNative
description: Bindings for third_party/ZeroTierSockets.h (libzt), as @Native functions in the libzt.dart asset.
output: lib/src/bindings.g.dart
ffi-native:
  asset-id: package:zerotier_sockets/libzt.dart
headers:
  entry-points:
    - third_party/ZeroTierSockets.h
functions:
  include:
    - 'zts_.*'
globals:
  include:
    - 'zts_errno'
preamble: |
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names, constant_identifier_names, unused_field
comments:
  style: any
  length: brief
