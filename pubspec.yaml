name: zerotier_sockets
description: ZeroTier sockets (libzt) for Dart and Flutter. TCP and UDP over ZeroTier networks, built from source with native assets.
version: 2.0.0-dev.6
repository: https://github.com/nuc134r/zerotier_sockets_flutter

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_cmake: ^0.3.2

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.26.0

# The package's own tests run with the guarded allocator (see hook/build.dart).
hooks:
  user_defines:
    zerotier_sockets:
      memory_guard: true
